<svg width="100%" viewBox="0 0 680 1120" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Fraud Shield system architecture overview</title>
  <desc>Clean four-tier architecture diagram for the credit card fraud detection dashboard.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1 L8 5 L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .label { font: 600 15px "Segoe UI", Arial, sans-serif; }
      .title { font: 600 14px "Segoe UI", Arial, sans-serif; }
      .body { font: 400 12px "Segoe UI", Arial, sans-serif; }
      .small { font: 400 11px "Segoe UI", Arial, sans-serif; }
      .tier { stroke-width: 1; }
      .card { stroke-width: 1; }
      .arrow { fill: none; stroke: #4b5563; stroke-width: 1.35; marker-end: url(#arrow); }
      .muted-arrow { fill: none; stroke: #7a7f87; stroke-width: 1.1; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="680" height="1120" fill="#ffffff"/>

  <!-- Client tier -->
  <g>
    <rect class="tier" x="36" y="28" width="608" height="132" rx="16" fill="#eeedfe" stroke="#534ab7"/>
    <text class="label" x="56" y="57" fill="#3c3489">Client tier</text>

    <g>
      <rect class="card" x="60" y="82" width="170" height="56" rx="8" fill="#fbfbff" stroke="#6b62ca"/>
      <text class="title" x="145" y="105" text-anchor="middle" fill="#3c3489">Browser dashboard</text>
      <text class="body" x="145" y="124" text-anchor="middle" fill="#534ab7">index.html, JS fetch</text>
    </g>
    <g>
      <rect class="card" x="255" y="82" width="170" height="56" rx="8" fill="#fbfbff" stroke="#6b62ca"/>
      <text class="title" x="340" y="105" text-anchor="middle" fill="#3c3489">REST API client</text>
      <text class="body" x="340" y="124" text-anchor="middle" fill="#534ab7">JSON over HTTP</text>
    </g>
    <g>
      <rect class="card" x="450" y="82" width="170" height="56" rx="8" fill="#fbfbff" stroke="#6b62ca"/>
      <text class="title" x="535" y="105" text-anchor="middle" fill="#3c3489">CSV batch upload</text>
      <text class="body" x="535" y="124" text-anchor="middle" fill="#534ab7">multipart form POST</text>
    </g>
  </g>

  <path class="arrow" d="M340 160 L340 198"/>
  <text class="small" x="354" y="181" fill="#4b5563">HTTP requests and session cookie</text>

  <!-- Flask tier -->
  <g>
    <rect class="tier" x="36" y="198" width="608" height="252" rx="16" fill="#e1f5ee" stroke="#0f6e56"/>
    <text class="label" x="56" y="227" fill="#085041">Flask presentation tier - app.py and blueprints</text>

    <g>
      <rect class="card" x="60" y="254" width="170" height="72" rx="8" fill="#f7fffb" stroke="#0f6e56"/>
      <text class="title" x="145" y="279" text-anchor="middle" fill="#085041">auth.py</text>
      <text class="body" x="145" y="298" text-anchor="middle" fill="#0f6e56">GET /</text>
      <text class="body" x="145" y="315" text-anchor="middle" fill="#0f6e56">POST /login, /logout</text>
    </g>
    <g>
      <rect class="card" x="255" y="254" width="170" height="72" rx="8" fill="#f7fffb" stroke="#0f6e56"/>
      <text class="title" x="340" y="279" text-anchor="middle" fill="#085041">prediction.py</text>
      <text class="body" x="340" y="298" text-anchor="middle" fill="#0f6e56">POST /predict</text>
      <text class="body" x="340" y="315" text-anchor="middle" fill="#0f6e56">POST /api/upload-csv</text>
    </g>
    <g>
      <rect class="card" x="450" y="254" width="170" height="72" rx="8" fill="#f7fffb" stroke="#0f6e56"/>
      <text class="title" x="535" y="279" text-anchor="middle" fill="#085041">dashboard.py</text>
      <text class="body" x="535" y="298" text-anchor="middle" fill="#0f6e56">GET /api/dashboard</text>
      <text class="body" x="535" y="315" text-anchor="middle" fill="#0f6e56">GET /api/transactions</text>
    </g>

    <g>
      <rect class="card" x="60" y="350" width="170" height="58" rx="8" fill="#f6f4ee" stroke="#5f5e5a"/>
      <text class="title" x="145" y="374" text-anchor="middle" fill="#444441">alerts.py</text>
      <text class="body" x="145" y="394" text-anchor="middle" fill="#5f5e5a">acknowledge, verify</text>
    </g>
    <g>
      <rect class="card" x="255" y="350" width="170" height="58" rx="8" fill="#f6f4ee" stroke="#5f5e5a"/>
      <text class="title" x="340" y="374" text-anchor="middle" fill="#444441">utility endpoints</text>
      <text class="body" x="340" y="394" text-anchor="middle" fill="#5f5e5a">health, sample CSV</text>
    </g>
    <g>
      <rect class="card" x="450" y="350" width="170" height="58" rx="8" fill="#f6f4ee" stroke="#5f5e5a"/>
      <text class="title" x="535" y="374" text-anchor="middle" fill="#444441">routes/__init__.py</text>
      <text class="body" x="535" y="394" text-anchor="middle" fill="#5f5e5a">session guard</text>
    </g>
  </g>

  <path class="arrow" d="M340 450 L340 488"/>
  <text class="small" x="354" y="471" fill="#4b5563">monitor_transaction()</text>

  <!-- Service tier -->
  <g>
    <rect class="tier" x="36" y="488" width="608" height="330" rx="16" fill="#eaf3de" stroke="#3b6d11"/>
    <text class="label" x="56" y="517" fill="#27500a">Service engine tier - orchestration and ML inference</text>

    <g>
      <rect class="card" x="130" y="544" width="420" height="78" rx="8" fill="#fbfff6" stroke="#3b6d11"/>
      <text class="title" x="340" y="571" text-anchor="middle" fill="#27500a">scoring_service.py - monitor_transaction()</text>
      <text class="body" x="340" y="592" text-anchor="middle" fill="#3b6d11">parse - behavior - features - scale - predict - risk</text>
      <text class="body" x="340" y="609" text-anchor="middle" fill="#3b6d11">create alert, update profile, persist result</text>
    </g>

    <path class="muted-arrow" d="M230 622 L160 660"/>
    <path class="muted-arrow" d="M340 622 L340 660"/>
    <path class="muted-arrow" d="M450 622 L520 660"/>

    <g>
      <rect class="card" x="60" y="660" width="170" height="76" rx="8" fill="#fbfff6" stroke="#3b6d11"/>
      <text class="title" x="145" y="686" text-anchor="middle" fill="#27500a">behavior_service.py</text>
      <text class="body" x="145" y="706" text-anchor="middle" fill="#3b6d11">analyze_behavior()</text>
      <text class="body" x="145" y="724" text-anchor="middle" fill="#3b6d11">update_profile()</text>
    </g>
    <g>
      <rect class="card" x="255" y="660" width="170" height="76" rx="8" fill="#fbfff6" stroke="#3b6d11"/>
      <text class="title" x="340" y="686" text-anchor="middle" fill="#27500a">feature_engineering.py</text>
      <text class="body" x="340" y="706" text-anchor="middle" fill="#3b6d11">15 model features</text>
      <text class="body" x="340" y="724" text-anchor="middle" fill="#3b6d11">encoders, scaler input</text>
    </g>
    <g>
      <rect class="card" x="450" y="660" width="170" height="76" rx="8" fill="#fbfff6" stroke="#3b6d11"/>
      <text class="title" x="535" y="686" text-anchor="middle" fill="#27500a">alert_service.py</text>
      <text class="body" x="535" y="706" text-anchor="middle" fill="#3b6d11">create_alert_if_needed()</text>
      <text class="body" x="535" y="724" text-anchor="middle" fill="#3b6d11">fraud or high risk</text>
    </g>

    <g>
      <rect class="card" x="60" y="760" width="267" height="36" rx="8" fill="#fbfff6" stroke="#3b6d11"/>
      <text class="body" x="193" y="783" text-anchor="middle" fill="#27500a">RandomForest probability and threshold 0.449</text>
    </g>
    <g>
      <rect class="card" x="353" y="760" width="267" height="36" rx="8" fill="#fbfff6" stroke="#3b6d11"/>
      <text class="body" x="487" y="783" text-anchor="middle" fill="#27500a">Risk score = model + flag + behavior</text>
    </g>
  </g>

  <path class="arrow" d="M340 818 L340 856"/>
  <text class="small" x="354" y="839" fill="#4b5563">joblib.load() and save_state()</text>

  <!-- Data tier -->
  <g>
    <rect class="tier" x="36" y="856" width="608" height="230" rx="16" fill="#faeeda" stroke="#854f0b"/>
    <text class="label" x="56" y="885" fill="#633806">Data and artifact tier</text>

    <g>
      <rect class="card" x="60" y="912" width="170" height="64" rx="8" fill="#fffaf1" stroke="#854f0b"/>
      <text class="title" x="145" y="938" text-anchor="middle" fill="#633806">fraud_model.pkl</text>
      <text class="body" x="145" y="958" text-anchor="middle" fill="#854f0b">Random Forest artifact</text>
    </g>
    <g>
      <rect class="card" x="255" y="912" width="170" height="64" rx="8" fill="#fffaf1" stroke="#854f0b"/>
      <text class="title" x="340" y="938" text-anchor="middle" fill="#633806">scaler.pkl</text>
      <text class="body" x="340" y="958" text-anchor="middle" fill="#854f0b">StandardScaler artifact</text>
    </g>
    <g>
      <rect class="card" x="450" y="912" width="170" height="64" rx="8" fill="#fffaf1" stroke="#854f0b"/>
      <text class="title" x="535" y="938" text-anchor="middle" fill="#633806">model_metadata.json</text>
      <text class="body" x="535" y="958" text-anchor="middle" fill="#854f0b">threshold, metrics, folds</text>
    </g>

    <g>
      <rect class="card" x="60" y="1000" width="170" height="56" rx="8" fill="#f6f4ee" stroke="#5f5e5a"/>
      <text class="title" x="145" y="1023" text-anchor="middle" fill="#444441">data_store.json</text>
      <text class="body" x="145" y="1042" text-anchor="middle" fill="#5f5e5a">transactions and alerts</text>
    </g>
    <g>
      <rect class="card" x="255" y="1000" width="170" height="56" rx="8" fill="#f6f4ee" stroke="#5f5e5a"/>
      <text class="title" x="340" y="1023" text-anchor="middle" fill="#444441">train_model.py</text>
      <text class="body" x="340" y="1042" text-anchor="middle" fill="#5f5e5a">offline training pipeline</text>
    </g>
    <g>
      <rect class="card" x="450" y="1000" width="170" height="56" rx="8" fill="#f6f4ee" stroke="#5f5e5a"/>
      <text class="title" x="535" y="1023" text-anchor="middle" fill="#444441">smoke_test.py</text>
      <text class="body" x="535" y="1042" text-anchor="middle" fill="#5f5e5a">end-to-end regression</text>
    </g>
  </g>
</svg>
