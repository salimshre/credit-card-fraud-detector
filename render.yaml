services:
  - type: web
    name: credit-card-fraud-detector
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_USERNAME
        value: admin
      - key: APP_PASSWORD
        value: admin123
      - key: SECRET_KEY
        generateValue: true
      - key: FRAUD_STORE_PATH
        value: /tmp/fraud-shield-data-store.json
